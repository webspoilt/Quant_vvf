<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Matrix Grid Line -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Animated Sine/Diffusion Volatility Wave -->
  <path d="M 0 240 Q 150 180, 300 240 T 600 240 T 900 240 T 1200 240" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.4" filter="url(#glow)">
    <animate attributeName="d" 
      values="M 0 240 Q 150 170, 300 240 T 600 240 T 900 240 T 1200 240;
              M 0 240 Q 150 310, 300 240 T 600 240 T 900 240 T 1200 240;
              M 0 240 Q 150 170, 300 240 T 600 240 T 900 240 T 1200 240" 
      dur="6s" repeatCount="indefinite" />
  </path>
  
  <path d="M 0 250 Q 200 320, 400 250 T 800 250 T 1200 250" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3">
    <animate attributeName="d" 
      values="M 0 250 Q 200 320, 400 250 T 800 250 T 1200 250;
              M 0 250 Q 200 180, 400 250 T 800 250 T 1200 250;
              M 0 250 Q 200 320, 400 250 T 800 250 T 1200 250" 
      dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Core Branding & Title -->
  <text x="60" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="1.5">
    QUANT_VVF <tspan fill="url(#cyanGrad)">// MULTI-MARKET RESEARCH</tspan>
  </text>
  <text x="60" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#94a3b8" letter-spacing="0.5">
    MATHEMATICAL PHYSICS • STOCHASTIC CALCULUS • SPECTRAL RMT • DERIBIT • NSE • BSE • GIFT CITY
  </text>

  <!-- Interactive/Status Badges -->
  <g transform="translate(60, 135)">
    <!-- Badge 1: Verification -->
    <rect width="180" height="34" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#f8fafc">231/231 TESTS PASSING</text>

    <!-- Badge 2: Latency WAL -->
    <rect x="195" width="220" height="34" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="213" cy="17" r="5" fill="#06b6d4" />
    <text x="227" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#f8fafc">TRANSACTIONAL WAL [96B]</text>

    <!-- Badge 3: Multi-Market -->
    <rect x="430" width="230" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="448" cy="17" r="5" fill="#f59e0b" />
    <text x="462" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#f8fafc">DERIBIT • NSE • BSE • IFSC</text>
  </g>

  <!-- Four Pillars Container Boxes -->
  <g transform="translate(60, 195)">
    <!-- Box 1: Physics & Stochastic -->
    <rect width="255" height="130" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <rect width="255" height="4" rx="2" fill="url(#cyanGrad)" />
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#38bdf8">PHYSICS & STOCHASTICS</text>
    <text x="18" y="58" font-family="monospace" font-size="11" fill="#cbd5e1">∂p/∂t = -∂(μp) + ½∂²(σ²p)</text>
    <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• Feynman-Kac & Fokker-Planck</text>
    <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• Malliavin Greeks for Digitals</text>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• Rough Volterra (H ≈ 0.14)</text>

    <!-- Box 2: Spectral & Information Theory -->
    <rect x="275" width="255" height="130" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <rect x="275" width="255" height="4" rx="2" fill="url(#cyanGrad)" />
    <text x="293" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#38bdf8">SPECTRAL & INFO THEORY</text>
    <text x="293" y="58" font-family="monospace" font-size="11" fill="#cbd5e1">λ± = σ² (1 ± √(N/T))²</text>
    <text x="293" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• Marchenko-Pastur Denoising</text>
    <text x="293" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• Sinkhorn Wasserstein Drift</text>
    <text x="293" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• Directed Transfer Entropy</text>

    <!-- Box 3: Indian Derivatives & SABR -->
    <rect x="550" width="255" height="130" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <rect x="550" width="255" height="4" rx="2" fill="url(#goldGrad)" />
    <text x="568" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#f59e0b">INDIAN DERIVATIVES (F&O)</text>
    <text x="568" y="58" font-family="monospace" font-size="11" fill="#cbd5e1">σ_B(F, K) SABR Skew & Parity</text>
    <text x="568" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• NIFTY & BANKNIFTY Surfaces</text>
    <text x="568" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• Synthetic Futures Reversal</text>
    <text x="568" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• Implied Correlation Dispersion</text>

    <!-- Box 4: Compliance & Microstructure -->
    <rect x="825" width="255" height="130" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <rect x="825" width="255" height="4" rx="2" fill="url(#goldGrad)" />
    <text x="843" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#f59e0b">COMPLIANCE & TRADING</text>
    <text x="843" y="58" font-family="monospace" font-size="11" fill="#cbd5e1">SEBI OTR & Oct 2024 Tax Law</text>
    <text x="843" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• STT (0.02% Fut, 0.1% Opt)</text>
    <text x="843" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• OTR Throttling Controller</text>
    <text x="843" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">• NSE-BSE & GIFT Nifty Basis</text>
  </g>
</svg>
