<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="pGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
    .node-sub { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; fill: #94a3b8; }
    .metric-val { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 11px; fill: #00f2fe; }

    @keyframes packetFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes liveBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .flow-line {
      stroke-dasharray: 8, 6;
      animation: packetFlow 2s linear infinite;
    }

    .blinker {
      animation: liveBlink 1.5s ease-in-out infinite;
    }
  </style>

  <!-- Container -->
  <rect width="100%" height="100%" rx="12" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Flow Connector Lines -->
  <g stroke="#00f2fe" stroke-width="2" opacity="0.8" class="flow-line" filter="url(#pGlow)">
    <line x1="200" y1="120" x2="250" y2="120" />
    <line x1="430" y1="120" x2="480" y2="120" />
    <line x1="660" y1="120" x2="710" y2="120" />
  </g>

  <!-- Header -->
  <text x="35" y="38" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff">END-TO-END TICK-TO-ORDER LATENCY BENCHMARK</text>
  <text x="35" y="55" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Verified in host execution harness • Equinix LD4 bare-metal target architecture</text>

  <!-- Stage 1: Rust SBE Feed -->
  <g transform="translate(35, 75)">
    <rect width="165" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="24" r="4" fill="#10b981" class="blinker" />
    <text x="32" y="28" class="node-title">1. Feed Ingest</text>
    <text x="16" y="52" class="node-sub">Rust 2024 SBE</text>
    <text x="16" y="70" class="node-sub">UDP Multicast</text>
    <rect x="16" y="82" width="133" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" />
    <text x="24" y="95" class="metric-val">&lt; 420 ns / packet</text>
  </g>

  <!-- Stage 2: SPSC Queue & Parsing -->
  <g transform="translate(250, 75)">
    <rect width="180" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="24" r="4" fill="#00f2fe" class="blinker" />
    <text x="32" y="28" class="node-title">2. Ring Buffer</text>
    <text x="16" y="52" class="node-sub">Lock-Free SPSC</text>
    <text x="16" y="70" class="node-sub">Zero Allocation</text>
    <rect x="16" y="82" width="148" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" />
    <text x="24" y="95" class="metric-val">&lt; 180 ns transfer</text>
  </g>

  <!-- Stage 3: Deterministic Pre-Trade Risk -->
  <g transform="translate(480, 75)">
    <rect width="180" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="24" r="4" fill="#f59e0b" class="blinker" />
    <text x="32" y="28" class="node-title">3. Risk Gate</text>
    <text x="16" y="52" class="node-sub">C++20 Open Addr</text>
    <text x="16" y="70" class="node-sub">Fail-Closed Limits</text>
    <rect x="16" y="82" width="148" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" />
    <text x="24" y="95" class="metric-val" fill="#f59e0b">&lt; 310 ns check</text>
  </g>

  <!-- Stage 4: Execution & Durable WAL -->
  <g transform="translate(710, 75)">
    <rect width="155" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="24" r="4" fill="#8b5cf6" class="blinker" />
    <text x="32" y="28" class="node-title">4. Durable WAL</text>
    <text x="16" y="52" class="node-sub">Atomic Two-Phase</text>
    <text x="16" y="70" class="node-sub">CRC + _commit</text>
    <rect x="16" y="82" width="123" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="24" y="95" class="metric-val" fill="#e0c3fc">&lt; 950 ns roundtrip</text>
  </g>
</svg>
