<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b176fc" />
      <stop offset="100%" stop-color="#e0c3fc" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <!-- Volatility Wave Fill Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: 2px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #8ea3bf; letter-spacing: 0.5px; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
    .code-font { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; fill: #00f2fe; }

    /* Keyframe Animations */
    @keyframes pulseLine {
      0% { stroke-dashoffset: 2000; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -2000; }
    }

    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .animated-wave {
      stroke-dasharray: 1200;
      animation: pulseLine 18s linear infinite;
    }

    .radar {
      transform-origin: 1040px 170px;
      animation: radarSweep 12s linear infinite;
    }

    .blinking-light {
      animation: blinkDot 2s ease-in-out infinite;
    }

    .floating-box-1 {
      animation: floatCard 4s ease-in-out infinite;
    }
    .floating-box-2 {
      animation: floatCard 4.8s ease-in-out infinite 0.6s;
    }
    .floating-box-3 {
      animation: floatCard 5.2s ease-in-out infinite 1.2s;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" stroke="#1a2744" stroke-width="2"/>

  <!-- High-Tech Grid Lines -->
  <g stroke="#162238" stroke-width="1" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="340" y1="0" x2="340" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
    <line x1="620" y1="0" x2="620" y2="340" />
    <line x1="760" y1="0" x2="760" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1040" y1="0" x2="1040" y2="340" />
    
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Animated Volatility Curve in Background -->
  <path d="M 0 240 Q 150 160, 300 230 T 600 210 T 900 170 T 1200 220 L 1200 340 L 0 340 Z" fill="url(#waveGrad)" />
  <path class="animated-wave" d="M 0 240 Q 150 160, 300 230 T 600 210 T 900 170 T 1200 220" fill="none" stroke="url(#cyanGlow)" stroke-width="3" filter="url(#glow)"/>

  <!-- Radar Display Widget (Right Side) -->
  <circle cx="1040" cy="170" r="100" fill="none" stroke="#1f3354" stroke-width="1.5" />
  <circle cx="1040" cy="170" r="70" fill="none" stroke="#1f3354" stroke-width="1" stroke-dasharray="4,4" />
  <circle cx="1040" cy="170" r="40" fill="none" stroke="#1f3354" stroke-width="1" />
  <line x1="1040" y1="70" x2="1040" y2="270" stroke="#1f3354" stroke-width="1" />
  <line x1="940" y1="170" x2="1140" y2="170" stroke="#1f3354" stroke-width="1" />
  
  <g class="radar">
    <line x1="1040" y1="170" x2="1140" y2="170" stroke="#00f2fe" stroke-width="2" opacity="0.8" filter="url(#glow)" />
    <polygon points="1040,170 1140,170 1125,200" fill="#00f2fe" opacity="0.1" />
  </g>

  <!-- Live Pulse Indicators inside Radar -->
  <circle cx="1090" cy="140" r="4" fill="#00f2fe" class="blinking-light" filter="url(#glow)"/>
  <circle cx="990" cy="190" r="3.5" fill="#f6d365" class="blinking-light" />
  <circle cx="1060" cy="220" r="4.5" fill="#b176fc" class="blinking-light" />

  <!-- Left Header Content -->
  <g transform="translate(60, 50)">
    <!-- Status Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00f2fe" class="blinking-light" />
    <text x="26" y="17" class="code-font" font-size="11" fill="#00f2fe">SYSTEM ACTIVE • 216/216 TESTS</text>

    <!-- Main Title -->
    <text x="0" y="70" class="title-text">
      QUANT<tspan fill="#00f2fe">_VVF</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="102" class="subtitle-text">
      Institutional Crypto Derivatives • High-Frequency Execution • Deep Learning Volatility Engine
    </text>
  </g>

  <!-- 3 Interactive Metric Cards (Floating animation) -->
  <g transform="translate(60, 180)">
    <!-- Card 1: HFT Execution -->
    <g class="floating-box-1" transform="translate(0, 0)">
      <rect width="210" height="96" rx="10" fill="#0c1629" stroke="#1c2d4a" stroke-width="1.5" />
      <text x="16" y="28" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#8ea3bf">CORE EXECUTION</text>
      <text x="16" y="58" font-family="-apple-system, sans-serif" font-weight="800" font-size="24" fill="#00f2fe">C++20 &amp; Rust</text>
      <text x="16" y="80" class="code-font" font-size="11" fill="#4facfe">Zero-Alloc • Durable WAL</text>
    </g>

    <!-- Card 2: AI & Deep Learning -->
    <g class="floating-box-2" transform="translate(230, 0)">
      <rect width="230" height="96" rx="10" fill="#0c1629" stroke="#1c2d4a" stroke-width="1.5" />
      <text x="16" y="28" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#8ea3bf">NEURAL MODELS</text>
      <text x="16" y="58" font-family="-apple-system, sans-serif" font-weight="800" font-size="24" fill="#b176fc">PyTorch 2.15+</text>
      <text x="16" y="80" class="code-font" font-size="11" fill="#e0c3fc">TFT • DeepLOB • iTransformer</text>
    </g>

    <!-- Card 3: Quantitative Stochastics -->
    <g class="floating-box-3" transform="translate(480, 0)">
      <rect width="230" height="96" rx="10" fill="#0c1629" stroke="#1c2d4a" stroke-width="1.5" />
      <text x="16" y="28" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#8ea3bf">MATHEMATICAL REGISTRY</text>
      <text x="16" y="58" font-family="-apple-system, sans-serif" font-weight="800" font-size="24" fill="#f6d365">21 Papers</text>
      <text x="16" y="80" class="code-font" font-size="11" fill="#fda085">DCC-GARCH • SVI • EVT POT</text>
    </g>
  </g>
</svg>
