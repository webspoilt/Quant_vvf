<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="370">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Smile Gradient Fill -->
    <linearGradient id="smileFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b176fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b176fc" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .legend-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #ffffff; }
    .mono-num { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #94a3b8; }
    .disclaimer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #94a3b8; }

    @keyframes dashCycle {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-curve-1 {
      stroke-dasharray: 800;
      animation: dashCycle 6s ease-in-out infinite alternate;
    }
    .animated-curve-2 {
      stroke-dasharray: 800;
      animation: dashCycle 8s ease-in-out infinite alternate 1s;
    }
  </style>

  <!-- Container Box -->
  <rect width="100%" height="100%" rx="12" fill="url(#chartBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title & Legend -->
  <g transform="translate(40, 32)">
    <text class="legend-title" x="0" y="0">PARAMETRIC SVI VOLATILITY SMILE MODEL (ILLUSTRATIVE BTC SLICES)</text>
    <text class="axis-label" x="0" y="16">Gatheral Raw SVI: w(k) = a + b(rho(k-m) + sqrt((k-m)^2 + sigma^2)) • Verified Durrleman g(k) ≥ 0</text>

    <!-- Legend Items -->
    <g transform="translate(560, -5)">
      <circle cx="0" cy="0" r="4.5" fill="#00f2fe" />
      <text class="mono-num" x="12" y="3.5">7D Slice (Short Skew)</text>

      <circle cx="160" cy="0" r="4.5" fill="#d946ef" />
      <text class="mono-num" x="172" y="3.5">30D Slice (ATM Base)</text>
    </g>
  </g>

  <!-- Plot Area: x from 80 to 820, y from 90 to 290 -->
  <g transform="translate(60, 75)">
    <!-- Grid lines -->
    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3">
      <line x1="0" y1="0" x2="780" y2="0" />
      <line x1="0" y1="50" x2="780" y2="50" />
      <line x1="0" y1="100" x2="780" y2="100" />
      <line x1="0" y1="150" x2="780" y2="150" />
      <line x1="0" y1="200" x2="780" y2="200" />

      <line x1="0" y1="0" x2="0" y2="200" />
      <line x1="195" y1="0" x2="195" y2="200" />
      <line x1="390" y1="0" x2="390" y2="200" />
      <line x1="585" y1="0" x2="585" y2="200" />
      <line x1="780" y1="0" x2="780" y2="200" />
    </g>

    <!-- Y-Axis Labels (Implied Volatility) -->
    <text class="mono-num" x="-45" y="5">85%</text>
    <text class="mono-num" x="-45" y="55">70%</text>
    <text class="mono-num" x="-45" y="105">55%</text>
    <text class="mono-num" x="-45" y="155">40%</text>
    <text class="mono-num" x="-45" y="205">25%</text>

    <!-- X-Axis Labels (Log-Moneyness k = ln(K/F)) -->
    <text class="mono-num" x="-15" y="222">-0.60 (OTM Put)</text>
    <text class="mono-num" x="170" y="222">-0.30</text>
    <text class="mono-num" x="370" y="222">0.00 (ATM)</text>
    <text class="mono-num" x="565" y="222">+0.30</text>
    <text class="mono-num" x="740" y="222">+0.60 (OTM Call)</text>

    <!-- Smile Curve 1: 30D Expiry -->
    <path class="animated-curve-2" d="M 0 50 Q 220 165, 390 140 T 780 90" fill="none" stroke="url(#neonPurple)" stroke-width="3" filter="url(#neonGlow)"/>

    <!-- Smile Curve 2: 7D Expiry -->
    <path class="animated-curve-1" d="M 0 10 Q 200 185, 390 160 T 780 120" fill="none" stroke="url(#neonCyan)" stroke-width="3.5" filter="url(#neonGlow)"/>

    <!-- Synthetic Calibration Points -->
    <g fill="#00f2fe" stroke="#04060b" stroke-width="1.5">
      <circle cx="80" cy="55" r="4.5" />
      <circle cx="180" cy="115" r="4.5" />
      <circle cx="280" cy="150" r="4.5" />
      <circle cx="390" cy="160" r="5" fill="#ffffff" />
      <circle cx="500" cy="150" r="4.5" />
      <circle cx="610" cy="138" r="4.5" />
      <circle cx="710" cy="128" r="4.5" />
    </g>

    <!-- ATM Reference Callout -->
    <line x1="390" y1="160" x2="390" y2="200" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <rect x="345" y="105" width="90" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="353" y="120" class="mono-num" fill="#00f2fe" font-weight="700">ATM IV: 48.2%</text>
  </g>

  <!-- Empirical Reality Callout Banner -->
  <g transform="translate(40, 318)">
    <rect width="820" height="36" rx="6" fill="#0c121e" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="22" class="disclaimer-text">DISCLOSURE: This plot illustrates synthetic Gatheral SVI parametric slices [a=0.04, b=0.10, rho=-0.50, m=0.00, sigma=0.10]. Live market tick calibration is performed dynamically in libs/core/svi_surface.py.</text>
  </g>
</svg>
