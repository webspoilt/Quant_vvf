[build-system]
requires = ["setuptools>=70.0"]  # >=70.0.0 addresses CVE-2024-6345 (V-13/V-27)
build-backend = "setuptools.build_meta"

[project]
name = "quant-vvf"
version = "0.1.0"
description = "Falsification-first Volatility Risk Premium research and execution engine (Deribit BTC)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pyarrow>=14.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",  # >=2.32.3 addresses CVE-2024-35195 (V-13)
]

[project.optional-dependencies]
prod = ["nautilus-trader>=1.190"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.8",
    "QuantLib>=1.35",
    "nbformat>=5.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "realdata: tests that download/ingest real market data (slow, network)",
]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "pyarrow.*", "statsmodels.*", "nautilus_trader.*", "QuantLib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["execution.*"]
disallow_subclassing_any = false
